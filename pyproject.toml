[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-python-automation"
version = "1.0.0"
description = "Automated data analysis and PDF report generation with API integration and scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "schedule>=1.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
enterprise-report = "enterprise_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
